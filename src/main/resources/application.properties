# Person API
person.service.url=${PERSON_SERVICE_URL:http://host.docker.internal:8004/api/v1}

# Property Service API
property.service.url=${PROPERTY_SERVICE_URL:http://host.docker.internal:8005/api/v1}

# Notification API
notification.service.url=${NOTIFICATION_SERVICE_URL:http://host.docker.internal:8002/api/v1}

# Admin emails
property.platform.admin.emails=lawrencegrey.0125@gmail.com

# ========================================
# Actuator
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# ========================================
# OAuth2 Resource Server Configuration
# ========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/property-management-platform}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://host.docker.internal:8080/realms/property-management-platform/protocol/openid-connect/certs}

# ========================================
# Keycloak Backend Services Client
# ========================================
keycloak.realm=${KEYCLOAK_REALM:property-management-platform}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://host.docker.internal:8080}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:property-platform-backend-services}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:GIv2HhpLuX7Dy4Ge2IjtGXgaPqbBzOII}
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://host.docker.internal:8080/realms/property-management-platform/protocol/openid-connect/token}

# ========================================
# Logging
# ========================================
logging.level.org.springframework=INFO
logging.level.com.greysoft=DEBUG
