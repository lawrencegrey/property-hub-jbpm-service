spring.application.name=jbpm-engine

# ========================================
# jBPM / KIE Server Configuration
# ========================================
jbpm.kieserver.url=${JBPM_KIESERVER_URL:http://localhost:8090/kie-server/services/rest/server}
jbpm.kieserver.user=${JBPM_KIE_USER:wbadmin}
jbpm.kieserver.password=${JBPM_KIE_PASSWORD:wbadmin}
jbpm.business-central.url=${JBPM_BUSINESS_CENTRAL_URL:http://localhost:8090/business-central}
jbpm.container.id=${JBPM_CONTAINER_ID:property-platform}

# ========================================
# Server Configuration
# ========================================
server.port=8006

# ========================================
# Database Configuration
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5434/jbpm
spring.datasource.username=jbpm
spring.datasource.password=jbpm
spring.jpa.hibernate.ddl-auto=update

spring.docker.compose.enabled=false

# ========================================
# Swagger UI Configuration
# ========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ========================================
# External Service URLs
# ========================================
# Document API
document.service.url=${DOCUMENT_SERVICE_URL:http://host.docker.internal:8003/api/v1}

# Verification API
verification.service.url=${VERIFICATION_SERVICE_URL:http://host.docker.internal:8000/api/v1}
