# Docker profile configuration
spring.application.name=jbpm-engine

# ========================================
# jBPM / KIE Server Configuration (Docker)
# ========================================
jbpm.kieserver.url=http://jbpm-server-full:8080/kie-server/services/rest/server
jbpm.kieserver.user=wbadmin
jbpm.kieserver.password=wbadmin
jbpm.business-central.url=http://jbpm-server-full:8080/business-central
jbpm.container.id=property-platform

# ========================================
# Database Configuration (Docker)
# ========================================
spring.datasource.url=jdbc:postgresql://jbpm-postgres:5432/jbpm
spring.datasource.username=jbpm
spring.datasource.password=jbpm
spring.jpa.hibernate.ddl-auto=update

# Disable Docker Compose (already managed by external Docker Compose)
spring.docker.compose.enabled=false

# ========================================
# Server port
# ========================================
server.port=8006

# ========================================
# Swagger UI Configuration
# ========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ========================================
# Logging
# ========================================
logging.level.org.springframework=INFO
logging.level.com.greysoft=DEBUG

# ========================================
# Keycloak Backend Services Client (Docker)
# ========================================
keycloak.token-uri=http://host.docker.internal:8080/realms/property-management-platform/protocol/openid-connect/token
keycloak.client-id=property-platform-backend-services
